<title>Meus Gastos</title>
<script>
/* Endereço que não existe dentro do site. Acontece, por exemplo, quando o link de um e-mail (confirmar conta, criar nova senha)
   volta para um endereço escrito errado nas configurações. Em vez de mostrar uma página de erro, leva a pessoa para o app,
   mantendo o que veio depois de "?" e de "#": é ali que chega a resposta do link. */
var base = /github\.io$/.test(location.hostname) ? "/" + location.pathname.split("/")[1] + "/" : "/";
location.replace(base + location.search + location.hash);
</script>
