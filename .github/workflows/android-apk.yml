# Monta o APK de teste da bolinha (pasta android/) a cada envio para o ramo "android"
# e publica como um lançamento de teste, para baixar no tablet sem login.
name: APK de teste da bolinha

on:
  push:
    branches: [android]
    paths: ["android/**", ".github/workflows/android-apk.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Kit do Android (já vem na máquina do GitHub)
        run: echo "sdk.dir=$ANDROID_HOME" > android/local.properties && ls "$ANDROID_HOME"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Montar o APK
        run: gradle -p android assembleDebug --no-daemon --stacktrace
      - name: Dar nome ao arquivo
        run: cp android/app/build/outputs/apk/debug/app-debug.apk meus-gastos-bolinha-teste.apk
      - name: Publicar como lançamento de teste
        uses: softprops/action-gh-release@v2
        with:
          tag_name: bolinha-teste-${{ github.run_number }}
          name: "Bolinha (teste ${{ github.run_number }})"
          prerelease: true
          body: "APK de teste da bolinha do Meus Gastos. Baixe no tablet, instale e siga as instruções da tela. Não é a versão da loja."
          files: meus-gastos-bolinha-teste.apk
