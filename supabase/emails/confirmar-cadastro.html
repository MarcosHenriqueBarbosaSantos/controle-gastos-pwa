<!-- Supabase → Authentication → Emails → "Confirm signup".
     Assunto (Subject):  Confirme o seu e-mail no Meus Gastos
     Cole o conteúdo abaixo no campo "Message body". -->
<div style="font-family:Arial,Helvetica,sans-serif;max-width:480px;margin:0 auto;color:#16202b">
  <h2 style="margin:0 0 12px;font-size:20px;color:#1f3a5f">Meus Gastos</h2>
  <p style="font-size:15px;margin:0 0 18px">Falta um passo para a sua conta ficar pronta: confirmar que este e-mail é seu.</p>
  <p style="margin:0 0 22px"><a href="{{ .ConfirmationURL }}" style="background:#2a78d6;color:#ffffff;text-decoration:none;padding:12px 20px;border-radius:8px;font-weight:bold;font-size:15px;display:inline-block">Confirmar meu e-mail</a></p>
  <p style="font-size:14px;margin:0 0 18px">Depois de tocar no botão, volte ao app e entre com o e-mail e a senha que você escolheu.</p>
  <p style="font-size:12.5px;color:#6b7785;margin:0">O botão vale por 24 horas. Se não foi você quem criou a conta, é só ignorar esta mensagem.</p>
</div>
